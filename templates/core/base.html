{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SureJan{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="header-bar" data-testid="header-bar">
    <a class="header-logo" href="{% url 'home' %}">
      <img class="site-logo" src="{% static 'logo.png' %}" alt="SureJan">
    </a>
    {% block header_center %}{% endblock %}
    {% block header_right %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
  <footer class="footer">
    <a href="{% url 'terms' %}">Terms</a> ·
    <a href="{% url 'privacy' %}">Privacy</a> ·
    <a href="{% url 'rules' %}">Rules</a>
  </footer>
  <script src="{% static 'js/dropdown.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
