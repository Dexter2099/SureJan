{% if type == 'embed' %}
<div class="link-embed">{{ html|safe }}</div>
{% elif type == 'link' %}
<div class="link-card">
  <div class="link-card-inner">
    <img src="{{ favicon }}" alt="" class="link-favicon">
    <div class="link-meta">
      <div class="link-domain">{{ domain }}</div>
      {% if title %}<div class="link-title">{{ title }}</div>{% endif %}
    </div>
  </div>
</div>
{% endif %}
