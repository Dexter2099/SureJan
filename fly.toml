app = "surejan"
primary_region = "syd"

[env]
  PORT = "8000"

[deploy]
  release_command = "bash -lc 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[statics]]
  guest_path = "/app/staticfiles"
  url_prefix = "/static/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
