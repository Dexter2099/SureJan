# fly.toml — GMFU for Django on Fly Machines
app = "surejan"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

# VM sizing (bump memory to 1024 if you see OOM or heavy traffic)
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  
[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  PORT = "8000"
  FLY_APP_NAME = "surejan"   # optional, helps settings build hostnames

