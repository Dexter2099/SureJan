# fly.toml generated/maintained by you
app = "surejan"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "config.settings"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# -------- VM stanza UPDATED (memory from 256 -> 512) --------
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
# ------------------------------------------------------------
