# fly.toml — GMFU for Django on Fly Machines
app = "surejan"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  FLY_APP_NAME = "surejan"

[deploy]
  release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    type = "http"
    method = "get"
    path = "/healthz"
    interval = "10s"
    timeout = "2s"
    headers = { Host = "surejan.fly.dev" }

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

