# fly.toml — GMFU for Django on Fly Machines
app = "surejan"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  FLY_APP_NAME = "surejan"
  AWS_S3_ENDPOINT_URL = "https://fly.storage.tigris.dev"
  AWS_S3_REGION_NAME = "auto"
  DJANGO_SETTINGS_MODULE = "config.settings.prod"
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "surejan.app,www.surejan.app,localhost"
  DJANGO_SECRET_KEY = "use-a-strong-secret"
  DATABASE_URL = "postgres://<user>:<pass>@surejan-db-green.internal:5432/surejan"

[deploy]
  # release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout  = "5s"
    method   = "GET"
    path     = "/healthz"
    headers  = { Host = "surejan.app" }

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

