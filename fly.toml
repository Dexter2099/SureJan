# fly.toml — GMFU for Django on Fly Machines
app = "surejan"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "config.settings"
  # Helps settings build hostnames (also used in CSRF_TRUSTED_ORIGINS)
  FLY_APP_NAME = "surejan"

# Run DB migrations in the same environment the app uses
[deploy]
  release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true     # allow the app to sleep when idle
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# VM sizing (bump memory to 1024 if you see OOM or heavy traffic)
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
